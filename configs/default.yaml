video:
  source: "data/samples/demo.mp4"
  output_path: "outputs/videos/demo_result.mp4"
  save_json: true
  json_path: "outputs/json/demo_result.json"

runtime:
  device: "cuda"
  detect_every_n_frames: 3
  parking_slot_every_n_frames: 5
  max_frames: null

vehicle_detector:
  backend: "yolo"  # mock | yolo
  enabled: true
  model_path: "models/vehicle/yolo11n.pt"
  device: "cuda"
  classes:
    - car
    - truck
    - motorcycle
    - person
  conf_threshold: 0.35
  imgsz: 640
  near_filter_classes:
    - car
    - truck
    - bus
    - motorcycle
  min_bottom_y_ratio: 0.35
  min_bbox_height_ratio: 0.08
  min_bbox_area_ratio: 0.010
  min_near_score: 0.70
  max_detections: 1

parking_slot_detector:
  backend: "yolo_obb"  # mock | crpsd | yolo_obb
  model_path: "models/slot_detector/best_yolo_parkrecon.pt"
  external_repo_path: "external/CRPS-D"
  device: "cuda"
  depth_factor: 32
  conf_threshold: 0.55
  imgsz: 1024
  slot_pairing_strategy: "relaxed"  # crpsd | relaxed
  slot_postprocess_mode: "row_consensus"  # standard | row_consensus
  pairing_distance_scale: 1.0
  max_point_degree: 2
  min_slot_score: 0.35
  slot_nms_iou: 0.0
  slot_center_nms_distance: 28.0
  slot_angle_nms_threshold: 20.0
  slot_centerline_overlap_threshold: 0.0
  geometry_filter_enabled: false
  min_slot_area_ratio: 0.0
  max_slot_area_ratio: 1.0
  max_slot_aspect_ratio: 0.0
  max_out_of_frame_ratio: 1.0
  orientation_filter_enabled: false
  orientation_neighbor_radius: 130.0
  orientation_min_neighbors: 2
  orientation_angle_threshold: 60.0
  orientation_score_margin: 1.05

temporal_slot_smoothing:
  enabled: false
  mode: "quality_fill_gap"
  window: 5
  min_hits: 2
  max_missing: 4
  track_iou: 0.10
  max_center_distance: 45.0
  min_track_score: 0.50
  min_track_age: 2
  min_consecutive_hits: 2
  fill_gap_min_confidence: 0.45
  decay_on_miss: 0.85
  max_gap_fill: 1

tracker:
  type: "bytetrack"
  max_missed_frames: 15

occupancy:
  backend: "classifier"  # geometry | classifier
  vehicle_classes:
    - car
    - truck
    - motorcycle
  slot_coverage_threshold: 0.20
  speed_threshold_px: 2.0
  camera_vehicle_fusion:
    enabled: false
    vehicle_conf: 0.50
    vehicle_imgsz: 960
    match_distance_px: 75.0
    max_projected_distance_m: 5.0
    min_projected_points_per_evidence: 1
    min_camera_evidence_score: 0.05
    min_camera_distance_quality: 0.30
    require_inside_slot_match: true
    camera_evidence_hold_frames: 6
    camera_evidence_decay: 0.85
    min_held_camera_evidence_score: 0.03
    max_vehicles_per_camera: 1
    rotation_mode: "rt"
    camera_origin_sign: "negative_t"
    bev_cx: 586.5
    bev_cy: 725.5
    bev_meter_per_pixel: 0.0085
    swap_xy: true
    flip_x: false
    flip_y: true
    near_vehicles_only: true
    near_filter_mode: "all"
    near_min_bottom_y_ratio: 0.35
    near_min_height_ratio: 0.08
    near_min_area_ratio: 0.010
    near_max_height_ratio: 0.85
    near_max_area_ratio: 0.45
    near_min_score: 0.70
    note: "Camera vehicle detection is kept as diagnostic evidence only; occupancy status is decided by EfficientNet."
  occupied_confirm_frames: 5
  free_confirm_frames: 10
  classifier:
    model_path: "models/occupancy/efficientnet_b0_parkrecon_manual.pt"
    device: "cuda"
    crop_size: 224
    occupied_threshold: 0.50
    use_pretrained_backbone: false

release_prediction:
  enabled: true
  vehicle_classes:
    - car
    - truck
    - bus
    - motorcycle
  pedestrian_classes:
    - person
  slot_vehicle_overlap_threshold: 0.20
  pedestrian_near_distance_px: 90.0
  brake_light_red_ratio_threshold: 0.015
  parked_speed_threshold_px: 2.0
  moving_speed_threshold_px: 5.0
  motion_window: 5
  release_probability_threshold: 0.65
  base_score: 0.05
  overlap_weight: 0.10
  pedestrian_weight: 0.30
  brake_light_weight: 0.35
  motion_weight: 0.20

visualization:
  draw_slots: true
  draw_detections: true
  draw_tracks: true
